
name: Bot Berita Bola Lagi Panas

on:
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * *"

permissions:
  contents: write

jobs:
  post-news:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode bot
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instal kebutuhan
        run: pip install -r requirements.txt

      - name: Jalankan bot
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_GRAPH_VERSION: ${{ secrets.FB_GRAPH_VERSION }}
        run: python bot.py

      - name: Simpan riwayat berita
        run: |
          git config user.name "Bola Lagi Panas Bot"
          git config user.email "bot@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || git commit -m "Simpan riwayat berita"
          git push
